# Description: Compile rockchip rk35xx kernel
# Copyright (C) 2023 https://github.com/unifreq/linux-5.10.y-rk35xx
# Copyright (C) 2023 https://github.com/ophub/kernel
#==========================================================================

name: Compile rockchip rk35xx kernel

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: "Select the kernel source"
        required: false
        default: "unifreq/linux-6.1.y-rockchip"
        type: choice
        options:
          - unifreq/linux-6.1.y-rockchip
          - unifreq/linux-5.10.y-rk35xx
          - ophub/linux-6.1.y-rockchip
          - ophub/linux-5.10.y-rk35xx
          - armbian/linux-rockchip@rk-6.1-rkr6.1
          - armbian/linux-rockchip@rk-6.1-rkr5.1
      kernel_version:
        description: "Select kernel version"
        required: false
        default: "6.1.y"
        type: choice
        options:
          - 6.1.y
          - 5.10.y
      kernel_auto:
        description: "Auto use the latest kernel"
        required: false
        default: true
        type: boolean
      kernel_package:
        description: "Select compile package list"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - dtbs
      kernel_toolchain:
        description: "Select the compilation toolchain"
        required: false
        default: "gcc"
        type: choice
        options:
          - gcc
          - gcc-15.3
          - gcc-15.2
          - gcc-14.3
          - gcc-14.2
      ccache_clear:
        description: "Set whether to clear the cache"
        required: false
        default: false
        type: boolean
      docker_image:
        description: "Select Armbian docker image"
        required: false
        default: "resolute"
        type: choice
        options:
          - trixie
          - bookworm
          - resolute
          - noble
      kernel_sign:
        description: "Set the kernel custom signature"
        required: false
        default: "-rk35xx-ophub"
        type: choice
        options:
          - -rk35xx-ophub
          - -happy-new-year
          - -dragon-boat-festival
          - -mid-autumn-festival
          - -happy-national-day
          - -merry-christmas
          - -spring-plowing
          - -summer-growing
          - -autumn-harvesting
          - -winter-storing
          - -yourname
      kernel_config:
        description: "Set the path of kernel .config"
        required: false
        default: "kernel-config/release/rk35xx"
        type: choice
        options:
          - kernel-config/release/rk35xx
          - false

env:
  TZ: Etc/UTC

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize the build environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo apt-get -y update
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2604-build-armbian-depends)
          sudo systemctl daemon-reload
          #sudo apt-get -y full-upgrade
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
          sudo rm -rf ~/{.cargo,.dotnet,.rustup}
          sudo timedatectl set-timezone "${TZ:-Etc/UTC}"
          sudo ntpdate ntp.ubuntu.com 0.pool.ntp.org || true
          sudo timedatectl set-ntp true
          date -u
          timedatectl status || true
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Create virtual disk for extended storage
        id: disk
        run: |
          # Get available space in exact GB
          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [[ "${root_size}" -gt 0 ]] || { echo "Error: Insufficient space on /: ${root_avail}G available"; exit 1; }

          sudo truncate -s "${root_size}"G /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          echo "Using /: ${root_size}G"

          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "${build_dev}"
          sudo mkdir -p /builder
          sudo mount "${build_dev}" /builder
          sudo chown -R runner:runner /builder
          df -Th
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Get kernel source commit hash
        id: kernelhash
        run: |
          # Get the kernel source branch
          kernel_source="${{ inputs.kernel_source }}"
          [[ "${kernel_source}" =~ @ ]] && kernel_branch="$(echo "${kernel_source}" | awk -F'@' '{print $2}')" || kernel_branch="main"

          # Get the latest source hash from the kernel repository
          api_url="https://api.github.com/repos/${{ inputs.kernel_source }}/git/ref/heads/${kernel_branch}"
          source_hash=$(curl -fsSL -m 20 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              ${api_url} |
              jq -r '.object.sha'
          )
          [[ -z "${source_hash}" || "${source_hash}" == "null" ]] && source_hash="${{ github.sha }}"
          echo "source_hash=${source_hash}" >> ${GITHUB_ENV}
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: /builder/ccache
          key: kernel-rk35xx-${{ inputs.kernel_toolchain }}-${{ inputs.kernel_version }}-${{ env.source_hash }}
          restore-keys: |
            kernel-rk35xx-${{ inputs.kernel_toolchain }}-${{ inputs.kernel_version }}-

      - name: Compile the kernel [ ${{ inputs.kernel_version }} ]
        uses: ophub/amlogic-s9xxx-armbian@main
        if: ${{ !cancelled() }}
        with:
          build_target: "kernel"
          kernel_source: ${{ inputs.kernel_source }}
          kernel_version: ${{ inputs.kernel_version }}
          kernel_auto: ${{ inputs.kernel_auto }}
          kernel_package: ${{ inputs.kernel_package }}
          kernel_toolchain: ${{ inputs.kernel_toolchain }}
          kernel_sign: ${{ inputs.kernel_sign }}
          kernel_config: ${{ inputs.kernel_config }}
          ccache_clear: ${{ inputs.ccache_clear }}
          auto_patch: true
          kernel_patch: kernel-patch/beta
          enable_log: true
          docker_hostpath: /builder
          docker_image: ophub/armbian-${{ inputs.docker_image }}:arm64


      - name: Inject LB2004 DTS + Makefile + rebuild dtb
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          DOCKER_NAME=armbian-ophub
          if ! docker ps -q --filter "name=${DOCKER_NAME}" | grep -q .; then
            echo "::error::Docker not running"; exit 1
          fi
          KERNEL_SRC=/opt/kernel/compile-kernel/kernel/linux-6.1.y-rockchip-main
          DTS_DST=${KERNEL_SRC}/arch/arm64/boot/dts/rockchip

          echo "### 1/4 Copy DTS ###"
          docker cp kernel-patch/beta/linux-6.1.y-rockchip-main/rk3566-lb2004-bsp6.1.dts \
            ${DOCKER_NAME}:${DTS_DST}/rk3566-lb2004.dts
          docker exec ${DOCKER_NAME} ls -la ${DTS_DST}/rk3566-lb2004.dts || { echo "FAIL"; exit 1; }

          echo "### 2/4 Inject Makefile ###"
          docker exec ${DOCKER_NAME} bash -c "
            cd ${DTS_DST}
            grep -q 'rk3566-lb2004.dtb' Makefile || \
              sed -i '/rk3566-orangepi-3b-v2.1/ a dtb-\$(CONFIG_ARCH_ROCKCHIP) += rk3566-lb2004.dtb' Makefile
            grep lb2004 Makefile || { echo 'Makefile FAIL'; exit 1; }
          "

          echo "### 3/4 Rebuild dtb ###"
          docker exec ${DOCKER_NAME} bash -c "
            export ARCH=arm64 CROSS_COMPILE=aarch64-none-linux-gnu-
            export PATH=/usr/local/toolchain/arm-gnu-toolchain-15.3.rel1-aarch64-aarch64-none-linux-gnu/bin:\$PATH
            cd ${KERNEL_SRC}
            ls .config >/dev/null || { echo 'No .config'; exit 1; }
            make dtbs 2>&1 | tail -10
          "

          echo "### 4/4 Verify ###"
          docker exec ${DOCKER_NAME} ls -la ${DTS_DST}/rk3566-lb2004.dtb && echo "*** DTB BUILT ***" || { echo "MISSING"; exit 1; }
          mkdir -p /builder/compile-kernel/output/dtbs/6.1/dtb-rockchip/rockchip
          docker cp ${DOCKER_NAME}:${DTS_DST}/rk3566-lb2004.dtb \
            /builder/compile-kernel/output/dtbs/6.1/dtb-rockchip/rockchip/rk3566-lb2004.dtb
          echo "DONE"

      - name: Upload Kernel to Release
        uses: ophub/upload-to-releases@main
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        with:
          tag: kernel_rk35xx
          artifacts: ${{ env.PACKAGED_OUTPUTPATH }}/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            - BSP kernels for Rockchip rk3528/rk3566/rk3568
            - LB2004 dtb included
