#==========================================================================
# Description: Compile rockchip rk35xx kernel
# Copyright (C) 2023 https://github.com/unifreq/linux-5.10.y-rk35xx
# Copyright (C) 2023 https://github.com/ophub/kernel
#==========================================================================

name: Compile rockchip rk35xx kernel

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: "Select the kernel source"
        required: false
        default: "unifreq/linux-6.1.y-rockchip"
        type: choice
        options:
          - unifreq/linux-6.1.y-rockchip
          - unifreq/linux-5.10.y-rk35xx
          - ophub/linux-6.1.y-rockchip
          - ophub/linux-5.10.y-rk35xx
          - armbian/linux-rockchip@rk-6.1-rkr6.1
          - armbian/linux-rockchip@rk-6.1-rkr5.1
      kernel_version:
        description: "Select kernel version"
        required: false
        default: "6.1.y"
        type: choice
        options:
          - 6.1.y
          - 5.10.y
      kernel_auto:
        description: "Auto use the latest kernel"
        required: false
        default: true
        type: boolean
      kernel_package:
        description: "Select compile package list"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - dtbs
      kernel_toolchain:
        description: "Select the compilation toolchain"
        required: false
        default: "gcc"
        type: choice
        options:
          - gcc
          - gcc-15.3
          - gcc-15.2
          - gcc-14.3
          - gcc-14.2
      ccache_clear:
        description: "Set whether to clear the cache"
        required: false
        default: false
        type: boolean
      docker_image:
        description: "Select Armbian docker image"
        required: false
        default: "resolute"
        type: choice
        options:
          - trixie
          - bookworm
          - resolute
          - noble
      kernel_sign:
        description: "Set the kernel custom signature"
        required: false
        default: "-rk35xx-ophub"
        type: choice
        options:
          - -rk35xx-ophub
          - -happy-new-year
          - -dragon-boat-festival
          - -mid-autumn-festival
          - -happy-national-day
          - -merry-christmas
          - -spring-plowing
          - -summer-growing
          - -autumn-harvesting
          - -winter-storing
          - -yourname
      kernel_config:
        description: "Set the path of kernel .config"
        required: false
        default: "kernel-config/release/rk35xx"
        type: choice
        options:
          - kernel-config/release/rk35xx
          - false

env:
  TZ: Etc/UTC

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize the build environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo apt-get -y update
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2604-build-armbian-depends)
          sudo systemctl daemon-reload
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
          sudo rm -rf ~/{.cargo,.dotnet,.rustup}
          sudo timedatectl set-timezone "${TZ:-Etc/UTC}"
          sudo ntpdate ntp.ubuntu.com 0.pool.ntp.org || true
          sudo timedatectl set-ntp true
          date -u
          timedatectl status || true
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Create virtual disk for extended storage
        id: disk
        run: |
          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [[ "${root_size}" -gt 0 ]] || { echo "Error: Insufficient space on /: ${root_avail}G available"; exit 1; }

          sudo truncate -s "${root_size}"G /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          echo "Using /: ${root_size}G"

          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "${build_dev}"
          sudo mkdir -p /builder
          sudo mount "${build_dev}" /builder
          sudo chown -R runner:runner /builder
          df -Th
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Get kernel source commit hash
        id: kernelhash
        run: |
          kernel_source="${{ inputs.kernel_source }}"
          [[ "${kernel_source}" =~ @ ]] && kernel_branch="$(echo "${kernel_source}" | awk -F'@' '{print $2}')" || kernel_branch="main"

          api_url="https://api.github.com/repos/${{ inputs.kernel_source }}/git/ref/heads/${kernel_branch}"
          source_hash=$(curl -fsSL -m 20 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer *** secrets.GITHUB_TOKEN }}" \
              ${api_url} |
              jq -r '.object.sha'
          )
          [[ -z "${source_hash}" || "${source_hash}" == "null" ]] && source_hash="${{ github.sha }}"
          echo "source_hash=${source_hash}" >> ${GITHUB_ENV}
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: /builder/ccache
          key: kernel-rk35xx-${{ inputs.kernel_toolchain }}-${{ inputs.kernel_version }}-${{ env.source_hash }}
          restore-keys: |
            kernel-rk35xx-${{ inputs.kernel_toolchain }}-${{ inputs.kernel_version }}-




      - name: 🔍 后台探针 + 硬链接抢救员 (锁定 h96max-v56)
        shell: bash
        run: |
          RESCUE_DIR="${{ github.workspace }}/RESCUE_ZONE"
          mkdir -p "$RESCUE_DIR"
          TRACE_LOG="${{ github.workspace }}/rescue_trace.log"
          H96MAX_LOG="${{ github.workspace }}/h96max_dtc.log"
          echo "==== 探针 + 抢救员启动 $(date) ====" > "$TRACE_LOG"
          echo "=== h96max-v56 DTC 编译命令行输出 ===" > "$H96MAX_LOG"

          (
            while true; do
              # 硬链接抢救 .dtb 文件
              find /builder -type f \( -name "*.dtb" -o -name "*lb2004*" -o -name "*h96max*" \) 2>/dev/null | while read f; do
                f_identity=$(echo "$f" | md5sum | cut -c1-8)
                f_name=$(basename "$f")
                target_path="$RESCUE_DIR/${f_identity}_${f_name}"
                if [ ! -f "$target_path" ]; then
                  if ln "$f" "$target_path" 2>/dev/null; then
                    echo "[$(date +%T)] 🔒 锁死产物: $f" >> "$TRACE_LOG"
                  fi
                fi
              done
              # 抓取 h96max-v56 的 .cmd 文件 (容器内)
              DID=$(docker ps -q --filter "name=armbian-ophub" 2>/dev/null)
              if [ -n "$DID" ]; then
                docker exec $DID bash -c 'find /opt/kernel/ -name "*.cmd" -path "*h96max*" 2>/dev/null' | while read cmd_f; do
                  fname=$(basename "$cmd_f")
                  docker cp ${DID}:"$cmd_f" "$RESCUE_DIR/${fname}" 2>/dev/null && \
                    echo "[$(date +%T)] 🔧 抓取.cmd: $fname" >> "$TRACE_LOG"
                done
              fi
              sleep 0.5
            done
          ) &
          echo "RESCUE_PID=$!" >> $GITHUB_ENV

      - name: 📥 拉取 LB2004 引导程序 + model_database
        shell: bash
        run: |
          echo "=== 从 kemp233/u-boot 获取 lb2004 引导加载程序 ==="
          mkdir -p lb2004-boot
          curl -fsSL -o lb2004-boot/idbloader.img \
            "https://raw.githubusercontent.com/kemp233/u-boot/main/u-boot/rockchip/lb2004/idbloader.img"
          curl -fsSL -o lb2004-boot/u-boot.itb \
            "https://raw.githubusercontent.com/kemp233/u-boot/main/u-boot/rockchip/lb2004/u-boot.itb"
          ls -lh lb2004-boot/

          echo "=== 拉取 model_database.conf (含 lb2004 RK3566 条目) ==="
          curl -fsSL -o model_database.conf \
            "https://raw.githubusercontent.com/kemp233/amlogic-s9xxx-armbian/main/build-armbian/armbian-files/common-files/etc/model_database.conf"
          grep "lb2004" model_database.conf || echo "⚠️ lb2004 未在 model_database.conf 中找到!"
          echo "model_database.conf: $(wc -l < model_database.conf) 行"

      - name: Compile the kernel [${{ inputs.kernel_version }}]
        uses: ophub/amlogic-s9xxx-armbian@main
        id: compile
        if: ${{ !cancelled() }}
        env:
          DEBUG: "1"            # set -x
          V: "1"                # kernel Makefile verbose
          VERBOSE: "yes"         # Armbian script verbose
        with:
          build_target: "kernel"
          kernel_source: ${{ inputs.kernel_source }}
          kernel_version: ${{ inputs.kernel_version }}
          auto_patch: true
          kernel_patch: kernel-patch/beta
          enable_log: true
          docker_hostpath: /builder
          delete_source: false
          docker_image: ophub/armbian-${{ inputs.docker_image }}:arm64


      - name: 🚑 容器内物理搜救 (趁尸体还热)
        if: always()
        run: |
          echo "### 🚑 容器内部实时搜寻结果" >> $GITHUB_STEP_SUMMARY
          DOCKER_NAME="armbian-ophub"
          if docker ps -a --format '{{.Names}}' | grep -q "$DOCKER_NAME"; then
            echo "发现残留容器 $DOCKER_NAME，执行深度扫描..."
            # 直接在容器尚未销毁前把所有 dtb 捞出来
            docker exec $DOCKER_NAME find /opt/kernel/compile-kernel/ -name "*.dtb" 2>/dev/null | while read line; do
               fname=$(basename "$line")
               docker cp ${DOCKER_NAME}:"$line" "${{ github.workspace }}/RESCUE_ZONE/docker_save_${fname}" 2>/dev/null
               echo "- ✅ 成功从容器中救回: $fname" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "❌ 容器已被 Action 脚本秒删，只能依赖宿主机抢救结果。" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📊 终极抢救与考古报告
        if: always()
        shell: bash
        run: |
          [ -n "${RESCUE_PID}" ] && sudo kill ${RESCUE_PID} || true
          
          echo "### 🆘 成功从黑洞中抢下的产物" >> $GITHUB_STEP_SUMMARY
          RESCUED_COUNT=$(ls ${{ github.workspace }}/RESCUE_ZONE | wc -l)
          if [ "$RESCUED_COUNT" -gt 0 ]; then
            echo "| 文件标识 | 状态 |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            ls -lh ${{ github.workspace }}/RESCUE_ZONE | grep -v "total" | while read line; do
              echo "| \`$line\` | 🟢 已锁定 |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "❌ 失败：未能在清理前捕获到任何 lb2004 相关文件。" >> $GITHUB_STEP_SUMMARY
          fi

          echo "### 📜 抢救动作轨迹" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat "${{ github.workspace }}/rescue_trace.log" 2>/dev/null || echo "无轨迹数据" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "### 🔍 宿主机物理残留审计" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          sudo find /builder -iname "*lb2004*" -o -iname "*h96max*" 2>/dev/null || echo "宿主机路径已被彻底清空" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "### 🎯 h96max-v56 DTC 编译指令 (.cmd)" >> $GITHUB_STEP_SUMMARY
          for cmdfile in ${{ github.workspace }}/RESCUE_ZONE/*.cmd; do
            [ -f "$cmdfile" ] || continue
            echo "**$(basename $cmdfile):**" >> $GITHUB_STEP_SUMMARY
            echo '```shell' >> $GITHUB_STEP_SUMMARY
            cat "$cmdfile" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done

          echo "### DTC 编译日志 (h96max_dtc.log)" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat "${{ github.workspace }}/h96max_dtc.log" 2>/dev/null || echo "无 DTC 日志" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Upload Kernel to Release
        uses: ophub/upload-to-releases@main
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        with:
          tag: kernel_rk35xx
          artifacts: ${{ env.PACKAGED_OUTPUTPATH }}/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            - These RTISTIC kernels can be used for `Armbian`, `OpenWrt` and `FnNAS`.
            - These are dedicated BSP kernels for `Rockchip rk3528/rk3566/rk3568` and are not compatible with other series.

            <br />

            - 这些内核可用于 `Armbian`, `OpenWrt` 和 `FnNAS`。
            - 这些是 `Rockchip rk3528/rk3566/rk3568` 专用 BSP 内核，和其他系列不通用。
            - LB2004 dtb included
